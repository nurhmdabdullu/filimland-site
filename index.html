<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FILMLAND</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, Helvetica, sans-serif; background: #141414; color: #fff; }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 18px 4%; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); }
.logo { color: #e50914; font-size: 34px; font-weight: bold; letter-spacing: 2px; }
#search { padding: 10px 14px; border-radius: 4px; border: 1px solid #555; background: rgba(0,0,0,0.7); color: #fff; width: 240px; font-size: 15px; }
.hero { height: 85vh; background-size: cover; background-position: center top; display: flex; align-items: flex-end; padding: 0 4% 8%; position: relative; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, #141414 5%, transparent 60%), linear-gradient(to right, rgba(0,0,0,0.7), transparent 60%); }
.hero-text { position: relative; z-index: 2; max-width: 600px; }
.hero-text h1 { font-size: 56px; margin-bottom: 14px; }
.hero-text p { font-size: 18px; line-height: 1.5; margin-bottom: 20px; color: #ddd; }
.btn { display: inline-block; padding: 12px 28px; border-radius: 4px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; margin-right: 10px; }
.btn-red { background: #e50914; color: #fff; }
.btn-grey { background: rgba(109,109,110,0.7); color: #fff; }
.btn:hover { opacity: 0.85; }
h2 { padding: 20px 4% 10px; font-size: 24px; }
.row { display: flex; gap: 12px; overflow-x: auto; padding: 10px 4% 30px; scroll-behavior: smooth; }
.row::-webkit-scrollbar { height: 8px; }
.row::-webkit-scrollbar-thumb { background: #e50914; border-radius: 4px; }
.card { flex: 0 0 auto; width: 240px; cursor: pointer; transition: transform 0.25s; border-radius: 6px; overflow: hidden; background: #222; }
.card:hover { transform: scale(1.12); z-index: 5; box-shadow: 0 8px 24px rgba(0,0,0,0.8); }
.card img { width: 100%; height: 360px; object-fit: cover; display: block; }
.card .info { padding: 10px; font-size: 15px; }
.card .info small { color: #f5c518; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); justify-content: center; align-items: center; z-index: 100; padding: 16px; }
.modal.open { display: flex; }
.modal-box { background: #181818; border-radius: 10px; max-width: 900px; width: 100%; max-height: 92vh; overflow-y: auto; position: relative; }
.modal-top { height: 340px; background-size: cover; background-position: center; position: relative; }
.modal-top::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, #181818, transparent 70%); }
.modal-body { padding: 20px 30px 30px; }
.modal-body h3 { font-size: 34px; margin-bottom: 10px; }
.modal-body p { line-height: 1.6; margin-bottom: 14px; color: #ddd; font-size: 17px; }
.close { position: absolute; top: 12px; right: 18px; font-size: 36px; cursor: pointer; z-index: 5; background: #181818; border-radius: 50%; width: 44px; height: 44px; text-align: center; line-height: 42px; }
.trailer iframe { width: 100%; height: 380px; border: none; border-radius: 8px; }
@media (max-width: 700px) {
  .hero-text h1 { font-size: 34px; }
  .card { width: 160px; }
  .card img { height: 240px; }
  #search { width: 140px; }
  .trailer iframe { height: 220px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">FILMLAND</div>
  <input type="text" id="search" placeholder="Film axtar...">
</header>

<div class="hero" id="hero">
  <div class="hero-text">
    <h1 id="hero-title"></h1>
    <p id="hero-desc"></p>
    <button class="btn btn-red" id="hero-play">▶ Treyler</button>
    <button class="btn btn-grey" id="hero-info">Ətraflı</button>
  </div>
</div>

<h2>Populyar filmlər</h2>
<div class="row" id="row1"></div>

<h2>Ən yüksək reytinqli</h2>
<div class="row" id="row2"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="close" id="close">&times;</div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const films = [
  { ad: "Inception", il: 2010, reyting: 8.8, sekil: "https://image.tmdb.org/t/p/w500/ljsZTbVsrQSqZgWeep2B1QiDKuh.jpg", genis: "https://image.tmdb.org/t/p/original/s3TBrRGB1iav7gFOCNx3H31MoES.jpg", tesvir: "Xəyallara girib fikir oğurlayan oğrunun hekayəsi.", treyler: "YoHD9XEInc0" },
  { ad: "Interstellar", il: 2014, reyting: 8.7, sekil: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", genis: "https://image.tmdb.org/t/p/original/xJHokMbljvjADYdit5fK5VQsXEG.jpg", tesvir: "Bəşəriyyəti xilas etmək üçün kosmosa səyahət edən astronavtlar.", treyler: "zSWdZVtXT7E" },
  { ad: "The Dark Knight", il: 2008, reyting: 9.0, sekil: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg", genis: "https://image.tmdb.org/t/p/original/nMKdUUepR0i5zn0y1T4CsSB5chy.jpg", tesvir: "Batman və Coker arasında Qotham şəhəri uğrunda mübarizə.", treyler: "EXeTwQWrcwY" },
  { ad: "Avatar", il: 2009, reyting: 7.9, sekil: "https://image.tmdb.org/t/p/w500/kyeqWdyUXW608qlYkRqosgbbJyK.jpg", genis: "https://image.tmdb.org/t/p/original/vL5LR6WdxWPjLPFRLe133jXWsh5.jpg", tesvir: "Pandora planetində keçən epik macəra.", treyler: "5PSNL1qE6VY" },
  { ad: "Joker", il: 2019, reyting: 8.4, sekil: "https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg", genis: "https://image.tmdb.org/t/p/original/hO7KbdvGOtDdeg0W4Y5nKEHeDDh.jpg", tesvir: "Cəmiyyətdən sıxışdırılmış bir adamın Cokerə çevrilmə hekayəsi.", treyler: "zAGVQLHvwOY" },
  { ad: "Fight Club", il: 1999, reyting: 8.8, sekil: "https://image.tmdb.org/t/p/w500/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg", genis: "https://image.tmdb.org/t/p/original/hZkgoQYus5vegHoetLkCJzb17zJ.jpg", tesvir: "Yeraltı döyüş klubu yaradan iki adamın qəribə hekayəsi.", treyler: "qtRKdVHc-cE" }
];

const row1 = document.getElementById("row1");
const row2 = document.getElementById("row2");
const modal = document.getElementById("modal");
const modalContent = document.getElementById("modal-content");
const search = document.getElementById("search");
const hero = document.getElementById("hero");

const vitrin = films[2];
hero.style.backgroundImage = 'url("' + vitrin.genis + '")';
document.getElementById("hero-title").textContent = vitrin.ad;
document.getElementById("hero-desc").textContent = vitrin.tesvir;
document.getElementById("hero-play").addEventListener("click", function () { ac(vitrin); });
document.getElementById("hero-info").addEventListener("click", function () { ac(vitrin); });

function kartYarat(film) {
  const kart = document.createElement("div");
  kart.className = "card";
  kart.innerHTML =
    '<img src="' + film.sekil + '" alt="' + film.ad + '">' +
    '<div class="info">' + film.ad + '<br><small>★ ' + film.reyting + '</small> · ' + film.il + '</div>';
  kart.addEventListener("click", function () { ac(film); });
  return kart;
}

function goster(siyahi1, siyahi2) {
  row1.innerHTML = "";
  row2.innerHTML = "";
  siyahi1.forEach(function (f) { row1.appendChild(kartYarat(f)); });
  siyahi2.forEach(function (f) { row2.appendChild(kartYarat(f)); });
}

function ac(film) {
  modalContent.innerHTML =
    '<div class="modal-top" style="background-image:url(' + film.genis + ')"></div>' +
    '<div class="modal-body">' +
    '<h3>' + film.ad + ' (' + film.il + ')</h3>' +
    '<p>★ ' + film.reyting + '</p>' +
    '<p>' + film.tesvir + '</p>' +
    '<div class="trailer"><iframe src="https://www.youtube.com/embed/' + film.treyler + '" allowfullscreen></iframe></div>' +
    '</div>';
  modal.classList.add("open");
}

function bagla() {
  modal.classList.remove("open");
  modalContent.innerHTML = "";
}

document.getElementById("close").addEventListener("click", bagla);
modal.addEventListener("click", function (e) { if (e.target === modal) bagla(); });

search.addEventListener("input", function () {
  const soz = search.value.toLowerCase();
  const tapilan = films.filter(function (f) { return f.ad.toLowerCase().includes(soz); });
  goster(tapilan, tapilan);
});

const yuksek = films.slice().sort(function (a, b) { return b.reyting - a.reyting; });
goster(films, yuksek);
</script>
</body>
</html>
